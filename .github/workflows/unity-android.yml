name: Unity Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'UnityProject/**'
      - '.github/workflows/unity-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build AFTERLIGHT for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: UnityProject/Library
          key: UnityLibrary-6000.3.27f2-Android-${{ hashFiles('UnityProject/Assets/**', 'UnityProject/Packages/**', 'UnityProject/ProjectSettings/**') }}
          restore-keys: |
            UnityLibrary-6000.3.27f2-Android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          unityVersion: 6000.3.27f2
          targetPlatform: Android
          buildMethod: Afterlight.Editor.AfterlightBuild.BuildAndroid
          buildsPath: Builds
          buildName: AFTERLIGHT

      - name: Upload AFTERLIGHT APK
        uses: actions/upload-artifact@v4
        with:
          name: AFTERLIGHT-ANDROID-APK
          path: UnityProject/Builds/Android/AFTERLIGHT.apk
          if-no-files-found: error
          retention-days: 30
